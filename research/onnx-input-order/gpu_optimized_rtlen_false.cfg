# Config for dumping/running the requireExactNNLen=false branch.
# Same as the ONNX OpenVINO GPU config, plus requireMaxBoardSize = false so that
# KataGo builds the !requireExactNNLen variant of the internal ONNX graph.
onnxProvider = openvino
onnxOpenVINODeviceType = GPU
onnxTransformerNHWC = true
onnxOpenVINOPrecision = FP16
onnxOpenVINONumStreams = 2
numSearchThreads = 4
requireMaxBoardSize = false
